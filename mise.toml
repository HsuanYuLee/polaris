# Polaris root runtime toolchain.
# DP-183 makes these tools framework-owned runtime dependencies.

[tools]
"aqua:astral-sh/uv" = "0.11.7"
node = "22.12.0"
pnpm = "10.10.0"
python = "3.12"
"aqua:BurntSushi/ripgrep" = "14.1.1"
"aqua:jqlang/jq" = "1.7.1"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.init]
description = "拿到這份東西之後跑這一個：把每一支 skill 宣告的工具都裝齊。"
run = "bash .claude/skills/framework-release/scripts/polaris-init.sh"

[tasks.doctor]
description = "Run Polaris root runtime doctor."
run = "bash .claude/skills/framework-release/scripts/polaris-doctor.sh"

[tasks.doctor-mise]
description = "Check mise-managed tool resolution."
run = "bash .claude/skills/framework-release/scripts/doctor-mise-check.sh"

[tasks.release-version]
description = "Changeset-driven version bump: changeset version -> VERSION mirror -> CHANGELOG -> consume changesets (no-op safe)."
run = "bash .claude/skills/framework-release/scripts/release-version.sh --repo ."

